# /etc/nginx/sites-available/1010.b4ez.com
#
# The Annual Rite is a server process (NEW-SITE.md kind 4): nginx terminates
# TLS and proxies everything to the Node server on 127.0.0.1:8710, which
# serves both the API and the built pages (it decides what / shows once the
# tower is complete). Hashed assets are served straight from the release.
#
# Visitors' real addresses, which limit_req and the voter hashes depend on,
# don't come from this file. nginx.conf's http block includes
# /etc/nginx/snippets/cloudflare-real-ip.conf for every site, and
# cloudflare-ips (dabaez/droplet-infra) keeps it current. Without it, every
# visitor would look like one of Cloudflare's addresses.
#
# Install:
#   cp deploy/nginx/1010.b4ez.com.conf /etc/nginx/sites-available/1010.b4ez.com
#   ln -s ../sites-available/1010.b4ez.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The certificate comes first, while only the port-80 server is enabled
# (comment out the 443 one until the files exist):
#   install -d -m 755 /var/www/acme
#   certbot certonly --webroot -w /var/www/acme -d 1010.b4ez.com
#
# The webroot is outside the releases on purpose: certbot runs as root, and a
# root-owned .well-known/ inside a release stops the rite user from pruning
# that release, which fails every deploy. A certificate first issued with
# -w /srv/sites/rite/current/public renews from the same place until
# webroot_path in /etc/letsencrypt/renewal/1010.b4ez.com.conf is changed too.

server {
    listen 80;
    listen [::]:80;
    server_name 1010.b4ez.com;

    # certbot --webroot, for the first certificate and its renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 1010.b4ez.com;

    ssl_certificate     /etc/letsencrypt/live/1010.b4ez.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1010.b4ez.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    limit_req zone=ddos_limit burst=50 nodelay;
    limit_req_status 429;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options        "SAMEORIGIN"                 always;
    add_header X-Content-Type-Options "nosniff"                    always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    client_max_body_size 64k;

    # Content-hashed build assets: straight from disk, cached forever.
    location /_astro/ {
        root /srv/sites/rite/current/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
